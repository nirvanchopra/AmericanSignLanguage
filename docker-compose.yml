version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: signbridge-postgres
    restart: always
    environment:
      POSTGRES_DB: signbridge
      POSTGRES_USER: signbridge_user
      POSTGRES_PASSWORD: signbridge_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signbridge_user -d signbridge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: signbridge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signbridge-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://signbridge_user:signbridge_secure_password_2026@postgres:5432/signbridge
      - SECRET_KEY=signbridge-production-secret-key-change-in-prod-2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signbridge-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
